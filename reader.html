<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chế độ đọc</title>
    <link rel="stylesheet" href="reader.css">
  </head>
  <body data-theme="light" data-font="sans" data-highlight="sentence">
    <header class="topbar">
      <div class="brand"><span class="book-icon" aria-hidden="true">▤</span><span>Chế độ đọc</span></div>
      <div class="toolbar" aria-label="Tùy chỉnh chế độ đọc">
        <div class="playback" aria-label="Điều khiển phát">
          <button id="play-pause" class="play-button" aria-label="Phát">▶</button>
          <span id="voice-loading" class="voice-loading" role="status" aria-label="Đang tải giọng đọc" hidden><span></span></span>
          <button id="previous" class="icon-button" aria-label="Câu trước" title="Câu trước">‹</button>
          <button id="next" class="icon-button" aria-label="Câu tiếp" title="Câu tiếp">›</button>
          <select id="speed" aria-label="Tốc độ đọc"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1">1×</option><option value="1.25" selected>1,25×</option><option value="1.5">1,5×</option><option value="1.75">1,75×</option><option value="2">2×</option></select>
        </div>
        <button id="close-full" class="icon-button full-only" title="Đóng toàn bộ trang" aria-label="Đóng toàn bộ trang">×</button>
        <button id="refresh" class="icon-button" title="Tải lại nội dung trang" aria-label="Tải lại nội dung trang">↻</button>
        <button id="font-smaller" class="icon-button" title="Thu nhỏ cỡ chữ" aria-label="Thu nhỏ cỡ chữ">A−</button>
        <button id="font-larger" class="icon-button" title="Tăng cỡ chữ" aria-label="Tăng cỡ chữ">A+</button>
        <button id="settings-toggle" class="icon-button" title="Cài đặt đọc" aria-label="Cài đặt đọc">⚙</button>
      </div>
    </header>
    <section id="settings" class="settings" hidden aria-label="Cài đặt đọc">
      <label>Giọng đọc<select id="voice" aria-label="Chọn giọng đọc"></select></label>
      <label>Phông chữ<select id="font"><option value="sans">Arial</option><option value="segoe-ui">Segoe UI</option><option value="tahoma">Tahoma</option><option value="verdana">Verdana</option><option value="serif">Georgia</option><option value="mono">Courier New</option></select></label>
      <label>Chủ đề<select id="theme"><option value="light">Sáng</option><option value="sepia">Sepia</option><option value="dark">Tối</option></select></label>
      <label>Xem<select id="view-mode"><option value="side">Bảng điều khiển bên</option><option value="full">Toàn bộ trang</option></select></label>
      <label>Chiều cao dòng<select id="line-spacing"><option value="1.4">Chật</option><option value="1.8">Vừa</option><option value="2.2">Rộng</option></select></label>
      <label>Khoảng cách chữ<select id="letter-spacing"><option value="0">Mặc định</option><option value="0.04em">Rộng</option><option value="0.08em">Rất rộng</option></select></label>
      <label class="check"><input id="show-links" type="checkbox" checked> Hiện liên kết</label>
      <label class="check"><input id="show-images" type="checkbox" checked> Hiện hình ảnh</label>
      <label>Tô sáng khi đọc<select id="highlight"><option value="adaptive">Thích ứng</option><option value="word">Từng từ</option><option value="sentence">Từng câu</option><option value="none">Tắt</option></select></label>
      <label class="check"><input id="line-effect" type="checkbox"> Hiệu ứng tô sáng dòng</label>
      <button id="reset-settings" class="reset">Đặt lại cài đặt</button>
    </section>
    <main id="reader" class="reader">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">▤</div>
        <h1>Đọc tập trung</h1>
        <p>Mở một trang có bài viết, sau đó chọn biểu tượng Leo Reader trên thanh công cụ.</p>
        <button id="read-page" class="action-button">Đọc trang này</button>
      <button id="read-selection" class="link-button">Đọc đoạn văn bản đã chọn</button>
      </div>
      <article id="article" class="article" hidden>
        <h1 id="article-title"></h1>
        <div id="article-body" class="article-body"></div>
      </article>
    </main>
    <footer class="player" aria-label="Đọc to">
      <div class="voice-controls">
        <input id="progress" type="range" min="0" max="0" value="0" aria-label="Vị trí đọc">
        <span id="progress-label" class="progress-label">0 / 0</span>
      </div>
      <p id="status" class="status" role="status">Sẵn sàng đọc</p>
    </footer>
    <audio id="edge-audio" hidden></audio>
    <script src="reader.js"></script>
  </body>
</html>
